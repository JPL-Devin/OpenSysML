[package]
name = "opensysml"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
description = "Blocking Rust client for the OpenSysML sysml-grpc service"
license = "Apache-2.0"
repository = "https://github.com/Open-MBEE/OpenSysML"
homepage = "https://github.com/Open-MBEE/OpenSysML"
documentation = "https://docs.rs/opensysml"
keywords = ["sysml", "modeling", "grpc"]
categories = ["api-bindings"]
include = [
    "src/**/*",
    "examples/**/*",
    "tests/**/*",
    "release-digests.json",
]

[dependencies]
prost = "=0.14.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "=0.10.9"
thiserror = "2.0.20"
ureq = { version = "=3.2.1", default-features = false, features = ["rustls"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
