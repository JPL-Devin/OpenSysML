version: v2
# TypeScript stubs for the npm client in clients/node. Committed, like the Python
# stubs, so `npm install` needs neither buf nor network. Run via `make proto-ts`
# (which `make proto` includes). The plugin version is pinned inline and fetched
# by npx, the way the Go entries are fetched by `go run`.
plugins:
  - local: ["npx", "--yes", "@bufbuild/protoc-gen-es@2.14.0"]
    out: clients/node/src/generated
    opt: target=ts,import_extension=.js
