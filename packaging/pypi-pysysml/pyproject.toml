[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pysysml"
version = "0.3.0"
description = "Renamed: install opensysml instead"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "OpenSysML contributors" }]
keywords = ["sysml", "deprecated", "renamed", "opensysml"]

# No requires-python floor: a floor that excluded an interpreter would make pip
# fall back to 0.2.0 there, which is the silent outcome this release prevents.

# Deliberately no dependency on opensysml: installing it as a side effect would
# make `pysysml` keep working through the alias this release refuses to be.
dependencies = []

classifiers = [
  "Development Status :: 7 - Inactive",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/Open-MBEE/OpenSysML"
"Current package" = "https://pypi.org/project/opensysml/"
Changelog = "https://github.com/Open-MBEE/OpenSysML/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["pysysml"]
