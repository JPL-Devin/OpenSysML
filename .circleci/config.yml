version: 2.1

orbs:
  go: circleci/go@1.10.0

executors:
  go-executor:
    docker:
      - image: cimg/go:1.25
    resource_class: medium
  
  python-executor:
    docker:
      - image: cimg/python:3.11
    resource_class: medium

jobs:
  build-and-test:
    executor: go-executor
    steps:
      - checkout
      - go/load-cache
      - go/mod-download
      - go/save-cache
      
      - run:
          name: Check gofmt
          command: |
            unformatted=$(gofmt -l .)
            if [ -n "$unformatted" ]; then
              echo "The following files are not gofmt'd:"
              echo "$unformatted"
              exit 1
            fi
      
      - run:
          name: Run go vet
          command: go vet ./...

      - run:
          name: Run static analysis (staticcheck + gosec)
          command: make lint
      
      - run:
          name: Run tests
          command: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...
      
      - run:
          name: Build binaries
          command: |
            VERSION=${CIRCLE_TAG:-dev}
            COMMIT=${CIRCLE_SHA1:-unknown}
            BUILD_TIME=$(date -u '+%Y-%m-%d_%H:%M:%S')
            GO_VERSION=$(go version | awk '{print $3}')
            
            make build VERSION="$VERSION" COMMIT="$COMMIT" BUILD_TIME="$BUILD_TIME" GO_VERSION="$GO_VERSION"
      
      - run:
          name: Verify binaries
          command: |
            ./bin/sysml --version
            ./bin/sysml-lsp --version
            ls -lh bin/
      
      - persist_to_workspace:
          root: .
          paths:
            - bin/sysml-grpc
      
      - store_artifacts:
          path: bin/
          destination: binaries
      
      - store_test_results:
          path: coverage.txt
  
  python-test:
    executor: python-executor
    steps:
      - checkout
      
      - attach_workspace:
          at: .
      
      - run:
          name: Install sysml-grpc binary
          command: |
            mkdir -p ~/.pysysml/bin
            cp bin/sysml-grpc ~/.pysysml/bin/
            chmod +x ~/.pysysml/bin/sysml-grpc
      
      - run:
          name: Install Python package
          command: |
            cd python
            pip install -e .
            pip install pytest pytest-mock
      
      # The integration tests skip without a service on localhost:50051, and
      # starting one here fails test_lifecycle: see docs/ROADMAP.md §P1.
      - run:
          name: Run Python tests
          command: |
            cd python
            pytest tests/ -v
      
      - run:
          name: Verify import
          command: |
            python3 -c "import pysysml; print(f'pysysml {pysysml.__version__} imported successfully')"

  build-release:
    executor: go-executor
    steps:
      - checkout
      - go/load-cache
      - go/mod-download
      - go/save-cache
      
      - run:
          name: Build release binaries
          command: |
            VERSION=${CIRCLE_TAG}
            COMMIT=${CIRCLE_SHA1}
            BUILD_TIME=$(date -u '+%Y-%m-%d_%H:%M:%S')
            GO_VERSION=$(go version | awk '{print $3}')
            
            # Build for multiple platforms using make
            mkdir -p dist
            
            GOOS=linux GOARCH=amd64 make build-sysml VERSION="$VERSION" COMMIT="$COMMIT" BUILD_TIME="$BUILD_TIME" GO_VERSION="$GO_VERSION"
            mv bin/sysml dist/sysml-linux-amd64
            
            GOOS=linux GOARCH=arm64 make build-sysml VERSION="$VERSION" COMMIT="$COMMIT" BUILD_TIME="$BUILD_TIME" GO_VERSION="$GO_VERSION"
            mv bin/sysml dist/sysml-linux-arm64
            
            GOOS=darwin GOARCH=amd64 make build-sysml VERSION="$VERSION" COMMIT="$COMMIT" BUILD_TIME="$BUILD_TIME" GO_VERSION="$GO_VERSION"
            mv bin/sysml dist/sysml-darwin-amd64
            
            GOOS=darwin GOARCH=arm64 make build-sysml VERSION="$VERSION" COMMIT="$COMMIT" BUILD_TIME="$BUILD_TIME" GO_VERSION="$GO_VERSION"
            mv bin/sysml dist/sysml-darwin-arm64
            
            GOOS=windows GOARCH=amd64 make build-sysml VERSION="$VERSION" COMMIT="$COMMIT" BUILD_TIME="$BUILD_TIME" GO_VERSION="$GO_VERSION"
            mv bin/sysml dist/sysml-windows-amd64.exe
            
            GOOS=linux GOARCH=amd64 make build-lsp VERSION="$VERSION" COMMIT="$COMMIT" BUILD_TIME="$BUILD_TIME" GO_VERSION="$GO_VERSION"
            mv bin/sysml-lsp dist/sysml-lsp-linux-amd64
            
            GOOS=linux GOARCH=arm64 make build-lsp VERSION="$VERSION" COMMIT="$COMMIT" BUILD_TIME="$BUILD_TIME" GO_VERSION="$GO_VERSION"
            mv bin/sysml-lsp dist/sysml-lsp-linux-arm64
            
            GOOS=darwin GOARCH=amd64 make build-lsp VERSION="$VERSION" COMMIT="$COMMIT" BUILD_TIME="$BUILD_TIME" GO_VERSION="$GO_VERSION"
            mv bin/sysml-lsp dist/sysml-lsp-darwin-amd64
            
            GOOS=darwin GOARCH=arm64 make build-lsp VERSION="$VERSION" COMMIT="$COMMIT" BUILD_TIME="$BUILD_TIME" GO_VERSION="$GO_VERSION"
            mv bin/sysml-lsp dist/sysml-lsp-darwin-arm64
            
            GOOS=windows GOARCH=amd64 make build-lsp VERSION="$VERSION" COMMIT="$COMMIT" BUILD_TIME="$BUILD_TIME" GO_VERSION="$GO_VERSION"
            mv bin/sysml-lsp dist/sysml-lsp-windows-amd64.exe
            
            # The gRPC service backs the Python client, which downloads one
            # file per platform and verifies it against a .sha256 sidecar, so
            # these are published raw rather than archived. They are built into
            # a subdirectory to keep them out of the archive globs below.
            mkdir -p dist/grpc
            
            GOOS=linux GOARCH=amd64 make build-grpc VERSION="$VERSION" COMMIT="$COMMIT" BUILD_TIME="$BUILD_TIME" GO_VERSION="$GO_VERSION"
            mv bin/sysml-grpc dist/grpc/sysml-grpc-linux-amd64
            
            GOOS=linux GOARCH=arm64 make build-grpc VERSION="$VERSION" COMMIT="$COMMIT" BUILD_TIME="$BUILD_TIME" GO_VERSION="$GO_VERSION"
            mv bin/sysml-grpc dist/grpc/sysml-grpc-linux-arm64
            
            GOOS=darwin GOARCH=amd64 make build-grpc VERSION="$VERSION" COMMIT="$COMMIT" BUILD_TIME="$BUILD_TIME" GO_VERSION="$GO_VERSION"
            mv bin/sysml-grpc dist/grpc/sysml-grpc-darwin-amd64
            
            GOOS=darwin GOARCH=arm64 make build-grpc VERSION="$VERSION" COMMIT="$COMMIT" BUILD_TIME="$BUILD_TIME" GO_VERSION="$GO_VERSION"
            mv bin/sysml-grpc dist/grpc/sysml-grpc-darwin-arm64
            
            GOOS=windows GOARCH=amd64 make build-grpc VERSION="$VERSION" COMMIT="$COMMIT" BUILD_TIME="$BUILD_TIME" GO_VERSION="$GO_VERSION"
            mv bin/sysml-grpc dist/grpc/sysml-grpc-windows-amd64.exe
            
            # Create tarballs
            cd dist
            for binary in sysml-*; do
              if [[ $binary == *.exe ]]; then
                zip "${binary%.exe}.zip" "$binary"
              else
                tar czf "${binary}.tar.gz" "$binary"
              fi
            done
            
            # Bundle archives: both binaries under their plain names
            # (sysml, sysml-lsp), which is the layout a Homebrew formula or a
            # PATH install expects. The per-binary archives above are kept
            # unchanged so existing download links keep working.
            for platform in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
              stage="stage/${platform}"
              mkdir -p "$stage"
              cp "sysml-${platform}" "${stage}/sysml"
              cp "sysml-lsp-${platform}" "${stage}/sysml-lsp"
              tar czf "systemica-${platform}.tar.gz" -C "$stage" sysml sysml-lsp
            done
            mkdir -p stage/windows-amd64
            cp sysml-windows-amd64.exe stage/windows-amd64/sysml.exe
            cp sysml-lsp-windows-amd64.exe stage/windows-amd64/sysml-lsp.exe
            (cd stage/windows-amd64 && zip -q ../../systemica-windows-amd64.zip sysml.exe sysml-lsp.exe)
            rm -rf stage
            
            # Checksums over every published archive, so a Homebrew formula
            # (or a careful user) can verify a download.
            sha256sum ./*.tar.gz ./*.zip | sed 's|\./||' > SHA256SUMS.txt
            
            # Same for the raw gRPC binaries, plus a per-file sidecar, which is
            # the only checksum pysysml reads.
            (cd grpc && sha256sum sysml-grpc-* >> ../SHA256SUMS.txt)
            (cd grpc && for f in sysml-grpc-*; do sha256sum "$f" > "$f.sha256"; done)
            cat SHA256SUMS.txt
      
      - store_artifacts:
          path: dist/
          destination: release-binaries
      
      - persist_to_workspace:
          root: .
          paths:
            - dist

  publish-github-release:
    docker:
      - image: cibuilds/github:0.13
    steps:
      - attach_workspace:
          at: .
      
      - run:
          name: Publish Release on GitHub
          command: |
            VERSION="${CIRCLE_TAG}"
            if [ -z "$VERSION" ]; then
              echo "Error: CIRCLE_TAG is empty"
              exit 1
            fi
            echo "Publishing release $VERSION"
            ls -la dist/
            
            # Move only tarballs to a release directory
            mkdir -p dist/release
            mv dist/*.tar.gz dist/*.zip dist/release/ 2>/dev/null || true
            mv dist/grpc/* dist/release/
            mv dist/SHA256SUMS.txt dist/release/
            echo "Release artifacts:"
            ls -la dist/release/
            
            # Debug: Check available token variables
            echo "Checking for GitHub tokens..."
            env | grep -i "github\|circle" | grep -i token || echo "No tokens found in env"
            
            # Try different token variable names
            TOKEN="${GITHUB_TOKEN:-${GH_TOKEN:-${CIRCLE_TOKEN}}}"
            if [ -z "$TOKEN" ]; then
              echo "Error: No GitHub token found. Tried GITHUB_TOKEN, GH_TOKEN, CIRCLE_TOKEN"
              exit 1
            fi
            
            ghr -t "${TOKEN}" \
                -u "${CIRCLE_PROJECT_USERNAME}" \
                -r "${CIRCLE_PROJECT_REPONAME}" \
                -c "${CIRCLE_SHA1}" \
                -delete \
                "${VERSION}" \
                dist/release/

workflows:
  version: 2
  
  # Build and test on every commit (but not tags)
  build-test:
    jobs:
      - build-and-test:
          filters:
            branches:
              only: /.*/
            tags:
              ignore: /.*/
      - python-test:
          requires:
            - build-and-test
          filters:
            branches:
              only: /.*/
            tags:
              ignore: /.*/
  
  # Build and release on tags. The suite runs here too: a tag can point at any
  # commit, so a release is only published from a revision proven green.
  release:
    jobs:
      - build-and-test:
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v.*/

      - build-release:
          requires:
            - build-and-test
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v.*/
      
      - publish-github-release:
          requires:
            - build-release
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v.*/
