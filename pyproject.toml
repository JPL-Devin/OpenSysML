[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_backend"

[project]
name = "pysysml"
version = "0.1.0"
description = "Python client library for Systemica SysML v2 parser"
readme = "pysysml/README.md"
requires-python = ">=3.8"
dependencies = [
    "grpcio>=1.83.0",
    "protobuf>=7.35.1",
    "filelock>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-mock>=3.10.0",
    "grpcio-tools>=1.83.0",
]

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests (requiring service/network)",
]
