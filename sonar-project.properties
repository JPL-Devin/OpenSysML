sonar.projectKey=Open-MBEE_OpenSysML
sonar.organization=openmbee

# Go sources and tests share directories, so the split is by pattern, not path.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go

# Fixtures, demos, the fetched OMG corpus, and generated Go are not hand-written
# source, so they are kept out of the scan.
sonar.exclusions=**/*_test.go,testdata/**,examples/**,**/*.pb.go,internal/core/rdf/ontology/table.go
sonar.test.exclusions=testdata/**,examples/**

# The profile build-and-test already writes and persists to the workspace.
sonar.go.coverage.reportPaths=coverage.txt
