sonar.projectKey=Open-MBEE_OpenSysML
sonar.organization=openmbee

# Go sources and tests share directories, so the split is by pattern, not path.
# The clients keep theirs apart, so each language's test root is named too;
# without them a client's tests are measured as product code.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go,python/tests/**,clients/java/*/src/test/**,clients/node/test/**,rust/opensysml/tests/**

# Fixtures, demos, the fetched OMG corpus, and generated code are not
# hand-written source; scripts/ and .github/ stay in scope on purpose. The
# clients' protobuf and Connect stubs are generated by buf and guarded by a
# drift check in CI, so they belong here with **/*.pb.go rather than in a
# quality profile no one can act on.
sonar.exclusions=**/*_test.go,**/testdata/**,examples/**,python/tests/**,**/*.pb.go,internal/core/rdf/ontology/table.go,clients/node/src/generated/**,clients/java/opensysml-client/src/main/java/io/opensysml/proto/**,clients/java/opensysml-client/src/main/java/io/opensysml/internal/Protos.java,rust/opensysml/src/proto/**
sonar.test.exclusions=**/testdata/**,examples/**,python/tests/golden/**

# The profile build-and-test already writes and persists to the workspace.
sonar.go.coverage.reportPaths=coverage.txt
